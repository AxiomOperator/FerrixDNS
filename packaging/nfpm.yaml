# Builds .deb and .rpm packages. Run from the repository root, after a release build:
#   ARCH=amd64 VERSION=0.0.1 nfpm package --config packaging/nfpm.yaml --packager deb --target dist/
name: ferrixdns
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: FerrixDNS contributors
license: MIT OR Apache-2.0
description: |
  Self-hostable DNS filtering and management, with a web dashboard.
homepage: https://github.com/AxiomOperator/FerrixDNS
depends:
  - ca-certificates
contents:
  - src: target/release/ferrixdns
    dst: /usr/bin/ferrixdns
    file_info:
      mode: 0755
  - src: LICENSE-MIT
    dst: /usr/share/doc/ferrixdns/LICENSE-MIT
  - src: LICENSE-APACHE
    dst: /usr/share/doc/ferrixdns/LICENSE-APACHE
  - src: packaging/systemd/ferrixdns.service
    dst: /usr/lib/systemd/system/ferrixdns.service
    file_info:
      mode: 0644
  - src: packaging/systemd/ferrixdns.env
    dst: /etc/ferrixdns/ferrixdns.env
    type: config|noreplace
    file_info:
      mode: 0640
scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
