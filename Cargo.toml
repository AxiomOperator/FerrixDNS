[workspace]
resolver = "3"
members = [
    "crates/dns-backup",
    "crates/dns-cache",
    "crates/dns-lists",
    "crates/dns-policy",
    "crates/dns-upstreams",
    "crates/dns-runtime",
    "crates/dns-storage",
    "crates/dns-telemetry",
    "crates/node-api",
    "crates/node-bin",
    "tests/integration",
    "tests/performance",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
dns-backup = { path = "crates/dns-backup" }
dns-cache = { path = "crates/dns-cache" }
dns-lists = { path = "crates/dns-lists" }
dns-policy = { path = "crates/dns-policy" }
dns-upstreams = { path = "crates/dns-upstreams" }
dns-runtime = { path = "crates/dns-runtime" }
dns-storage = { path = "crates/dns-storage" }
dns-telemetry = { path = "crates/dns-telemetry" }
node-api = { path = "crates/node-api" }

anyhow = "1"
arc-swap = "1.9"
argon2 = "0.6"
async-trait = "0.1"
axum = { version = "0.8", features = ["http2"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
flate2 = "1"
clap = { version = "4.6", features = ["derive", "env"] }
hickory-net = { version = "0.26.3", features = ["dnssec-ring", "tokio"] }
hickory-proto = { version = "0.26.3", features = ["dnssec-ring"] }
hickory-server = "0.26.3"
humantime = "2.4"
idna = "1.1"
fst = "0.4"
futures-util = "0.3"
ipnet = "2"
moka = { version = "0.12", features = ["sync"] }
rand = "0.9"
regex = "1.13"
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rust-embed = "8.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
socket2 = "0.6"
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
tar = "0.4"
tempfile = "3.27"
thiserror = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1"
tower = "0.5"
tokio = { version = "1.54", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "3"
webpki-roots = "1"
utoipa = "6"

[profile.release]
lto = "thin"
strip = true

# Packet paths must not panic (spec section 3.2). clippy.toml relaxes these in tests.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
